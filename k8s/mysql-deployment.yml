# k8s/mysql-deployment.yml

apiVersion: apps/v1
kind: Deployment
# ↑ Deployment = "Halte immer X Instanzen dieser App am Laufen"
metadata:
  name: mysql
  namespace: taskmanager
spec:
  replicas: 1   # Eine MySQL-Instanz
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
              # ↑ Passwort aus Kubernetes Secret lesen
              #   (wie GitHub Secrets, aber für Kubernetes)
            - name: MYSQL_DATABASE
              value: taskmanager
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
              # ↑ Daten werden persistent gespeichert
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
            # ↑ PVC = Persistent Volume Claim
            #   "Ich brauche X GB Speicher"

---
# PersistentVolumeClaim = Anfrage für Speicherplatz
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: taskmanager
spec:
  accessModes:
    - ReadWriteOnce   # Nur ein Container kann schreiben
  resources:
    requests:
      storage: 10Gi   # 10 Gigabyte Speicher

---
# Service = "Wie erreiche ich MySQL von anderen Containern?"
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: taskmanager
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
  # ↑ ClusterIP = Nur intern erreichbar (nicht von außen)
  #   Gut für Datenbanken!