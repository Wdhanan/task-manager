# .github/workflows/ci-cd.yml
# Dieser Roboter wird automatisch gestartet wenn du Code pushst

name: TaskManager CI/CD Pipeline

# ══════════════════════════════════════════
# WANN soll der Roboter starten?
# ══════════════════════════════════════════
on:
  push:
    branches: [ main ]
    # ↑ "Nur wenn Code auf den 'main' Branch gepusht wird"
  pull_request:
    branches: [ main ]
    # ↑ "Auch wenn jemand eine Änderung vorschlägt"

# ══════════════════════════════════════════
# UMGEBUNGSVARIABLEN (für alle Jobs verfügbar)
# ══════════════════════════════════════════
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # ↑ secrets = Geheime Werte die NICHT im Code stehen
  #   (wie Passwörter in einem Safe)
  IMAGE_TAG: ${{ github.sha }}
  # ↑ github.sha = Einzigartiger Code für jeden Commit
  #   z.B. "a3f8c2d..." → jedes Image bekommt eigene Version

# ══════════════════════════════════════════
# JOBS = Die eigentlichen Aufgaben
# ══════════════════════════════════════════
jobs:

  # ─────────────────────────────────────
  # JOB 1: Backend testen
  # ─────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    # ↑ "Führe das auf einem frischen Ubuntu-Computer aus"
    #   GitHub stellt diesen Computer kostenlos zur Verfügung!

    steps:
      # Schritt A: Code herunterladen
      - name: Code herunterladen
        uses: actions/checkout@v4
        # ↑ "uses" = benutze eine fertige Aktion von GitHub
        # checkout = "Lade den Code herunter"

      # Schritt B: Java einrichten
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Schritt C: Tests ausführen
      - name: Tests ausführen
        run: |
          cd backend/backend
          mvn test
        # ↑ "run" = führe diese Befehle im Terminal aus

  # ─────────────────────────────────────
  # JOB 2: Frontend testen
  # ─────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-path: frontend/taskmanager-frontend/package-lock.json
          # ↑ cache = "Merke dir node_modules für nächstes Mal"
          #   Spart 2-3 Minuten beim npm install

      - name: Dependencies installieren
        run: |
          cd frontend/taskmanager-frontend
          npm ci

      - name: Frontend bauen (Prüfung)
        run: |
          cd frontend/taskmanager-frontend
          npm run build -- --configuration=production

  # ─────────────────────────────────────
  # JOB 3: Docker Images bauen & pushen
  # ─────────────────────────────────────
  build-and-push:
    name: 🐋 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # ↑ needs = "Warte bis DIESE Jobs erfolgreich waren"
    #   Nur wenn alle Tests grün sind → Images bauen

    steps:
      - uses: actions/checkout@v4

      # Bei Docker Hub einloggen
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Image bauen und pushen
      - name: Backend Image bauen
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }}

      # Frontend Image bauen und pushen
      - name: Frontend Image bauen
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/taskmanager-frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }}

  # ─────────────────────────────────────
  # JOB 4: Auf AWS deployen
  # ─────────────────────────────────────
  deploy:
    name: 🚀 Deploy nach AWS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # Nur auf main Branch deployen (nicht bei Pull Requests)
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # AWS Zugangsdaten einrichten
      - name: AWS Credentials einrichten
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
          # ↑ eu-central-1 = Frankfurt (EU)

      # kubectl (Kubernetes-Tool) einrichten
      - name: kubectl einrichten
        uses: azure/setup-kubectl@v3

      # Kubernetes Konfiguration von AWS holen
      - name: EKS Cluster verbinden
        run: |
          aws eks update-kubeconfig \
            --name taskmanager-cluster \
            --region eu-central-1

      # Kubernetes mit neuen Images aktualisieren
      - name: Kubernetes aktualisieren
        run: |
          # Kubernetes sagen: "Benutze das neue Image"
          kubectl set image deployment/backend \
            backend=${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }} \
            -n taskmanager

          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }} \
            -n taskmanager

          # Warten bis alles läuft
          kubectl rollout status deployment/backend -n taskmanager
          kubectl rollout status deployment/frontend -n taskmanager
