# .github/workflows/ci-cd.yml

name: TaskManager CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ─────────────────────────────────────
  # JOB 1: Backend testen
  # ─────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          # ↑ Maven Dependencies cachen → schnellere Builds

      - name: Tests ausführen
        run: |
          cd backend/backend
          mvn test -B
          # ↑ -B = Batch Mode (weniger Ausgabe, besser für CI)
        # Kein MySQL nötig – H2 aus src/test/resources/application.yml

  # ─────────────────────────────────────
  # JOB 2: Frontend testen
  # ─────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/taskmanager-frontend/package-lock.json
          

      - name: Dependencies installieren
        run: |
          cd frontend/taskmanager-frontend
          npm ci
          # npm ci = schnelleres, reproduzierbares npm install für CI

      - name: Frontend bauen
        run: |
          cd frontend/taskmanager-frontend
          npm run build -- --configuration=production

  # ─────────────────────────────────────
  # JOB 3: Docker Images bauen & pushen
  # ─────────────────────────────────────
  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }}

      - name: Frontend Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/taskmanager-frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }}

  # ─────────────────────────────────────
  # JOB 4: Auf AWS deployen
  # ─────────────────────────────────────
  deploy:
    name: Deploy nach AWS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: AWS Credentials einrichten
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: kubectl einrichten
        uses: azure/setup-kubectl@v3

      - name: EKS Cluster verbinden
        run: |
          aws eks update-kubeconfig \
            --name taskmanager-cluster \
            --region eu-central-1

      - name: Kubernetes aktualisieren
        run: |
          kubectl set image deployment/backend \
            backend=${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }} \
            -n taskmanager

          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }} \
            -n taskmanager

          kubectl rollout status deployment/backend -n taskmanager
          kubectl rollout status deployment/frontend -n taskmanager