# frontend/taskmanager-frontend/nginx.conf

events {}

http {
    include mime.types;
    
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Wichtig für Angular Routing!
        # Wenn eine URL nicht existiert → index.html ausliefern
        # Angular regelt dann selbst das Routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API-Requests zum Spring Boot Server weiterleiten
        location /api/ {
            proxy_pass http://backend:8080/api/;
            # ↑ "backend" = Name des Docker-Containers
        }
    }
}