<!-- src/app/pages/not-found/not-found.component.html -->

<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="text-center">

    <!-- Große 404 Zahl -->
    <div class="text-9xl font-bold text-blue-600 mb-4">404</div>
    <!--
      text-9xl = Sehr große Schrift (128px!)
      Perfekt für eine große, auffällige Zahl
    -->

    <h1 class="text-2xl font-bold text-gray-800 mb-2">
      Seite nicht gefunden
    </h1>
    <p class="text-gray-500 mb-8">
      Die Seite die du suchst existiert nicht.
    </p>

    <a routerLink="/dashboard"
       class="inline-flex items-center gap-2 bg-blue-600 text-white
              px-6 py-3 rounded-xl hover:bg-blue-700 transition-colors
              font-medium">
      <!--
        inline-flex = Wie inline-block, aber mit Flexbox-Eigenschaften
        Perfekt für Buttons mit Icon + Text nebeneinander
      -->
      ← Zurück zum Dashboard
    </a>
  </div>
</div>
