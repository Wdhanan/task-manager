<!-- src/app/pages/login/login.component.html -->

<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 
            flex items-center justify-center p-4">
  <!--
    min-h-screen = Mindesthöhe: ganzer Bildschirm
    bg-gradient-to-br = Hintergrundverlauf von oben-links nach unten-rechts
    from-blue-50 to-indigo-100 = Farben des Verlaufs
    flex items-center justify-center = Inhalt zentrieren (vertikal + horizontal)
    p-4 = padding 16px
  -->

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <!--
      bg-white = weißer Hintergrund
      rounded-2xl = stark abgerundete Ecken
      shadow-xl = großer Schatten
      w-full max-w-md = Volle Breite, aber maximal 448px (md = medium)
      p-8 = padding 32px
    -->

    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center 
                  justify-center mx-auto mb-4">
        <span class="text-white text-2xl font-bold">T</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Willkommen zurück</h1>
      <p class="text-gray-500 mt-1">Melde dich bei TaskManager an</p>
    </div>

    <!-- Fehlermeldung -->
    <!-- *ngIf = Element nur anzeigen wenn errorMessage nicht leer ist -->
    <div *ngIf="errorMessage" 
         class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 
                rounded-lg mb-6 text-sm">
      {{ errorMessage }}
      <!-- {{ }} = "Interpolation" - zeigt den Wert einer Variable an -->
    </div>

    <!-- DAS FORMULAR -->
    <!-- [formGroup]="loginForm" = Verbindet dieses HTML-Formular mit unserem TS-FormGroup -->
    <!-- (ngSubmit)="onSubmit()" = Ruft onSubmit() auf wenn Enter/Submit gedrückt wird -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- ── USERNAME FELD ── -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Benutzername
        </label>
        
        <!-- formControlName = Verbindet dieses Input mit dem 'username' Feld im FormGroup -->
        <input 
          type="text"
          formControlName="username"
          placeholder="dein_username"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-blue-500 
                 focus:border-transparent transition-all"
          [class.border-red-500]="username?.invalid && username?.touched"
          
        >
        
        <!-- Fehlermeldungen für dieses Feld -->
        <div *ngIf="username?.invalid && username?.touched" class="mt-1">
          <span *ngIf="username?.errors?.['required']" 
                class="text-red-500 text-xs">
            Benutzername ist erforderlich
          </span>
          <span *ngIf="username?.errors?.['minlength']" 
                class="text-red-500 text-xs">
            Mindestens 3 Zeichen
          </span>
        </div>
      </div>

      <!-- ── PASSWORD FELD ── -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Passwort
        </label>
        <input 
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                 focus:outline-none focus:ring-2 focus:ring-blue-500 
                 focus:border-transparent transition-all"
          [class.border-red-500]="password?.invalid && password?.touched"
        >
        <div *ngIf="password?.invalid && password?.touched" class="mt-1">
          <span *ngIf="password?.errors?.['required']" 
                class="text-red-500 text-xs">
            Passwort ist erforderlich
          </span>
          <span *ngIf="password?.errors?.['minlength']" 
                class="text-red-500 text-xs">
            Mindestens 6 Zeichen
          </span>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button 
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold
               hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500
               disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      >
        <!-- *ngIf mit else Block -->
        <span *ngIf="!isLoading">Anmelden</span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" 
                    stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" 
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Wird angemeldet...
        </span>
      </button>
    </form>

    <!-- Link zur Registrierung -->
    <p class="text-center mt-6 text-gray-500 text-sm">
      Noch kein Konto? 
      <!-- routerLink = Angular-eigener Link (kein normaler <a href>) -->
      <a routerLink="/register" 
         class="text-blue-600 font-semibold hover:underline">
        Jetzt registrieren
      </a>
    </p>
  </div>
</div>
