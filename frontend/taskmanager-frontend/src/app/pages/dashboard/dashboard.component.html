<!-- src/app/pages/dashboard/dashboard.component.html -->

<div class="space-y-8">

  <!-- BEGRÜSSUNGS-HEADER -->
  <div class="bg-gradient-to-r from-blue-600 to-indigo-600
              rounded-2xl p-8 text-white">
    <!--
      bg-gradient-to-r = Verlauf von links nach rechts
      from-blue-600    = Startfarbe: Blau
      to-indigo-600    = Endfarbe: Indigo
    -->
    <h1 class="text-3xl font-bold">
      {{ getGreeting() }}, {{ currentUser?.username }}! 👋
      <!--
        {{ getGreeting() }} = Ruft die Methode auf und zeigt das Ergebnis
        {{ currentUser?.username }} = ? = "Nur zugreifen wenn currentUser nicht null"
      -->
    </h1>
    <p class="mt-2 text-blue-100">
      Hier ist eine Übersicht deiner Aufgaben
    </p>
  </div>

  <!-- STATISTIK KARTEN -->
  <div>
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Übersicht</h2>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="flex justify-center py-12">
      <div class="animate-spin h-10 w-10 border-4 border-blue-600
                  border-t-transparent rounded-full"></div>
    </div>

    <!-- grid grid-cols-2 lg:grid-cols-4 = 
         Auf kleinen Bildschirmen: 2 Spalten
         Auf großen Bildschirmen (lg = 1024px+): 4 Spalten
         Das nennt man RESPONSIVE DESIGN -->
    <div *ngIf="!isLoading"
         class="grid grid-cols-2 lg:grid-cols-4 gap-4">

      <!-- *ngFor über die stats-Array -->
      <div *ngFor="let stat of stats"
           [class]="'rounded-xl p-6 ' + stat.color">
        <!--
          [class]="..." = Dynamische Klasse
          Das ' + stat.color' hängt die Farbe aus dem Objekt an
        -->

        <div class="flex items-center justify-between mb-3">
          <span class="text-3xl">{{ stat.icon }}</span>
        </div>

        <div [class]="'text-3xl font-bold mb-1 ' + stat.textColor">
          {{ stat.value }}
        </div>
        <div class="text-sm text-gray-600 font-medium">
          {{ stat.title }}
        </div>
      </div>
    </div>
  </div>

  <!-- SCHNELLZUGRIFF -->
  <div>
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Schnellzugriff</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!--
        md:grid-cols-2 = Auf mittleren Bildschirmen (768px+): 2 Spalten
        Auf mobilen Geräten: 1 Spalte (grid-cols-1)
      -->

      <!-- Karte: Neue Aufgabe -->
      <a routerLink="/tasks"
         class="bg-white rounded-xl p-6 shadow-sm border border-gray-100
                hover:shadow-md transition-shadow flex items-center gap-4
                group cursor-pointer">
        <!--
          group = Ermöglicht group-hover auf Kindelementen
          cursor-pointer = Zeiger-Cursor (Hand) beim Hover
        -->
        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center
                    justify-center group-hover:bg-blue-600 transition-colors">
          <!--
            group-hover:bg-blue-600 = Wenn das ELTERNELEMENT (group) gehovered wird
            → Hintergrund wird blau
          -->
          <span class="text-2xl">✅</span>
        </div>
        <div>
          <h3 class="font-semibold text-gray-800">Aufgaben verwalten</h3>
          <p class="text-sm text-gray-500">Alle Aufgaben anzeigen und bearbeiten</p>
        </div>
        <span class="ml-auto text-gray-300 group-hover:text-blue-600
                     transition-colors text-xl">→</span>
      </a>

      <!-- Karte: Profil -->
      <a routerLink="/profile"
         class="bg-white rounded-xl p-6 shadow-sm border border-gray-100
                hover:shadow-md transition-shadow flex items-center gap-4
                group cursor-pointer">
        <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center
                    justify-center group-hover:bg-purple-600 transition-colors">
          <span class="text-2xl">👤</span>
        </div>
        <div>
          <h3 class="font-semibold text-gray-800">Mein Profil</h3>
          <p class="text-sm text-gray-500">Profil und Einstellungen</p>
        </div>
        <span class="ml-auto text-gray-300 group-hover:text-purple-600
                     transition-colors text-xl">→</span>
      </a>
    </div>
  </div>
</div>
