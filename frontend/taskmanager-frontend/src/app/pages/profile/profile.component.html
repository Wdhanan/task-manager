<!-- src/app/pages/profile/profile.component.html -->

<div class="space-y-6 max-w-2xl">
  <!--
    max-w-2xl = Maximale Breite 672px
    Verhindert dass die Karte auf großen Bildschirmen zu breit wird
  -->

  <h1 class="text-2xl font-bold text-gray-800">Mein Profil</h1>

  <!-- PROFIL KARTE -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

    <!-- Avatar + Name -->
    <div class="flex items-center gap-6 mb-8">

      <!-- Großer Avatar-Kreis -->
      <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center
                  justify-center text-white text-3xl font-bold flex-shrink-0">
        <!--
          flex-shrink-0 = "Dieser Div darf sich NICHT verkleinern"
          Ohne das: Bei wenig Platz würde der Kreis kleiner werden
        -->
        {{ getInitials() }}
      </div>

      <div>
        <h2 class="text-xl font-bold text-gray-800">
          {{ currentUser?.username }}
        </h2>
        <p class="text-gray-500">{{ currentUser?.email }}</p>
        <!-- Badge für die Rolle -->
        <span class="inline-block mt-2 px-3 py-1 bg-blue-100 text-blue-700
                     text-xs font-medium rounded-full">
          <!--
            inline-block = Verhält sich wie inline (im Textfluss)
                           ABER kann Breite/Höhe/Padding haben
            Das ist wichtig für Badges/Tags
          -->
          {{ currentUser?.role }}
        </span>
      </div>
    </div>

    <!-- Trennlinie -->
    <hr class="border-gray-100 mb-6">
    <!--
      hr = horizontal rule = eine Trennlinie
      border-gray-100 = sehr helle graue Linie
    -->

    <!-- Profil-Informationen -->
    <div class="space-y-4">
      <h3 class="font-semibold text-gray-700">Kontoinformationen</h3>

      <!-- Jede Info-Zeile -->
      <div class="grid grid-cols-3 gap-4 py-3 border-b border-gray-50">
        <span class="text-sm text-gray-500">Benutzername</span>
        <span class="col-span-2 text-sm font-medium text-gray-800">
          {{ currentUser?.username }}
        </span>
        <!--
          col-span-2 = Diese Spalte nimmt 2 von 3 Spalten ein
          Das schafft ein Label + Wert Layout:
          [Label (1 Spalte)] [Wert (2 Spalten)]
        -->
      </div>

      <div class="grid grid-cols-3 gap-4 py-3 border-b border-gray-50">
        <span class="text-sm text-gray-500">Email</span>
        <span class="col-span-2 text-sm font-medium text-gray-800">
          {{ currentUser?.email }}
        </span>
      </div>

      <div class="grid grid-cols-3 gap-4 py-3">
        <span class="text-sm text-gray-500">Rolle</span>
        <span class="col-span-2 text-sm font-medium text-gray-800">
          {{ currentUser?.role }}
        </span>
      </div>
    </div>
  </div>

  <!-- ABMELDEN BUTTON -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h3 class="font-semibold text-gray-700 mb-4">Konto</h3>
    <button
      (click)="logout()"
      class="flex items-center gap-3 px-4 py-3 text-red-600 bg-red-50
             hover:bg-red-100 rounded-xl transition-colors font-medium text-sm"
    >
      <span>🚪</span>
      Abmelden
    </button>
  </div>
</div>
