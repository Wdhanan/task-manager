<!-- src/app/pages/register/register.component.html -->

<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100
            flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center
                  justify-center mx-auto mb-4">
        <span class="text-white text-2xl font-bold">T</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Konto erstellen</h1>
      <p class="text-gray-500 mt-1">Registriere dich bei TaskManager</p>
    </div>

    <!-- Fehlermeldung -->
    <div *ngIf="errorMessage"
         class="bg-red-50 border border-red-200 text-red-700 px-4 py-3
                rounded-lg mb-6 text-sm">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Vorname + Nachname nebeneinander -->
      <!-- grid grid-cols-2 = 2 gleich breite Spalten nebeneinander -->
      <!-- gap-4 = 16px Abstand zwischen den Spalten -->
      <div class="grid grid-cols-2 gap-4 mb-5">

        <!-- Vorname -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Vorname
          </label>
          <input
            type="text"
            formControlName="firstName"
            placeholder="Max"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition-all"
            [class.border-red-500]="firstName?.invalid && firstName?.touched"
          >
          <span *ngIf="firstName?.invalid && firstName?.touched"
                class="text-red-500 text-xs">
            Vorname ist erforderlich
          </span>
        </div>

        <!-- Nachname -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Nachname
          </label>
          <input
            type="text"
            formControlName="lastName"
            placeholder="Muster"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition-all"
            [class.border-red-500]="lastName?.invalid && lastName?.touched"
          >
          <span *ngIf="lastName?.invalid && lastName?.touched"
                class="text-red-500 text-xs">
            Nachname ist erforderlich
          </span>
        </div>
      </div>

      <!-- Benutzername -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Benutzername
        </label>
        <input
          type="text"
          formControlName="username"
          placeholder="max_muster"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-transparent transition-all"
          [class.border-red-500]="username?.invalid && username?.touched"
        >
        <div *ngIf="username?.invalid && username?.touched" class="mt-1">
          <span *ngIf="username?.errors?.['required']"
                class="text-red-500 text-xs">Benutzername ist erforderlich</span>
          <span *ngIf="username?.errors?.['minlength']"
                class="text-red-500 text-xs">Mindestens 3 Zeichen</span>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email-Adresse
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="max@beispiel.de"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-transparent transition-all"
          [class.border-red-500]="email?.invalid && email?.touched"
        >
        <div *ngIf="email?.invalid && email?.touched" class="mt-1">
          <span *ngIf="email?.errors?.['required']"
                class="text-red-500 text-xs">Email ist erforderlich</span>
          <span *ngIf="email?.errors?.['email']"
                class="text-red-500 text-xs">Ungültige Email-Adresse</span>
        </div>
      </div>

      <!-- Passwort -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Passwort
        </label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-transparent transition-all"
          [class.border-red-500]="password?.invalid && password?.touched"
        >
        <div *ngIf="password?.invalid && password?.touched" class="mt-1">
          <span *ngIf="password?.errors?.['required']"
                class="text-red-500 text-xs">Passwort ist erforderlich</span>
          <span *ngIf="password?.errors?.['minlength']"
                class="text-red-500 text-xs">Mindestens 6 Zeichen</span>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold
               hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
               transition-all"
      >
        <span *ngIf="!isLoading">Registrieren</span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10"
                    stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Wird registriert...
        </span>
      </button>
    </form>

    <p class="text-center mt-6 text-gray-500 text-sm">
      Bereits ein Konto?
      <a routerLink="/login"
         class="text-blue-600 font-semibold hover:underline">
        Anmelden
      </a>
    </p>
  </div>
</div>
