<!-- src/app/components/sidebar/sidebar.component.html -->

<aside class="w-64 bg-gray-900 min-h-screen fixed left-0 top-0 
              flex flex-col z-20">
  <!--
    w-64 = Breite: 256px
    bg-gray-900 = Sehr dunkles Grau (fast schwarz)
    min-h-screen = Mindestens Bildschirmhöhe
    fixed left-0 top-0 = Links oben fixiert
    flex flex-col = Kindelemente untereinander
  -->

  <!-- Logo Bereich -->
  <div class="p-6 border-b border-gray-700">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center 
                  justify-center text-white font-bold text-lg">
        T
      </div>
      <span class="text-white font-bold text-lg">TaskManager</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-1">
    <!-- 
      routerLinkActive="active-class" = Fügt Klasse hinzu wenn diese Route aktiv ist
      [routerLinkActiveOptions]="{exact: true}" = NUR bei exakter URL-Übereinstimmung
    -->
    
    <a routerLink="/dashboard" 
       routerLinkActive="bg-blue-600 text-white"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 
              hover:bg-gray-800 hover:text-white transition-all group">
      <span class="text-xl">🏠</span>
      <span class="font-medium">Dashboard</span>
    </a>

    <a routerLink="/tasks"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 
              hover:bg-gray-800 hover:text-white transition-all">
      <span class="text-xl">✅</span>
      <span class="font-medium">Aufgaben</span>
    </a>

    <a routerLink="/profile"
       routerLinkActive="bg-blue-600 text-white"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 
              hover:bg-gray-800 hover:text-white transition-all">
      <span class="text-xl">👤</span>
      <span class="font-medium">Profil</span>
    </a>
  </nav>
</aside>
